networks:
  notara-network:
    name: notara-network
    driver: bridge

volumes:
  postgres_usuarios_data:
  postgres_notas_metas_data:
  postgres_pagos_data:
  postgres_vocabulario_data:
  mongo_data:
  redis_data:

services:
  postgres-usuarios:
    image: postgres:16-alpine
    container_name: notara-postgres-usuarios
    environment:
      POSTGRES_DB: notara-usuarios-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
    networks:
      - notara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-pagos:
    image: postgres:16-alpine
    container_name: notara-postgres-pagos
    environment:
      POSTGRES_DB: notara-pagos-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_pagos_data:/var/lib/postgresql/data
    networks:
      - notara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notas-metas:
    image: postgres:16-alpine
    container_name: notara-postgres-notas-metas
    environment:
      POSTGRES_DB: notara-notas-metas-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_notas_metas_data:/var/lib/postgresql/data
    networks:
      - notara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-vocabulario:
    image: postgres:16-alpine
    container_name: notara-postgres-vocabulario
    environment:
      POSTGRES_DB: notara-vocabulario-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_vocabulario_data:/var/lib/postgresql/data
    networks:
      - notara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: notara-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - notara-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notara-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - notara-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notara-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - notara-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
