<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13" role="img">
  <title>Arquitectura de Microservicios — Notara</title>
  <desc>Diagrama de arquitectura con Frontend, API Gateway, 6 microservicios, bases de datos, Redis y RabbitMQ</desc>

  <!-- Background -->
  <rect width="1100" height="720" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Arquitectura de Microservicios — Notara</text>
  <text x="550" y="52" text-anchor="middle" font-size="11" fill="#64748b">DSY1106 · Desarrollo Fullstack III</text>

  <!-- ══ FRONTEND ══ -->
  <rect x="430" y="68" width="240" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="90" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Frontend</text>
  <text x="550" y="107" text-anchor="middle" fill="#1d4ed8" font-size="11">Next.js 14 · React 18</text>
  <text x="550" y="122" text-anchor="middle" fill="#1d4ed8" font-size="11">Jest · Cobertura 97% · puerto :3001</text>

  <!-- Arrow FE → GW -->
  <line x1="550" y1="132" x2="550" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="150" font-size="10" fill="#64748b">HTTP</text>

