  <text x="550" y="180" text-anchor="middle" font-weight="bold" fill="#5b21b6">API Gateway (BFF) · Node.js Express · puerto :3000</text>
  <text x="550" y="198" text-anchor="middle" fill="#5b21b6" font-size="11">Enrutamiento · Proxy JWT · OAuth Spotify · Chat IA (Claude)</text>

  <!-- Arrows GW → MS -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

